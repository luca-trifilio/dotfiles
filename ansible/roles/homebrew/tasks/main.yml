---
- name: Install Homebrew if missing
  ansible.builtin.command:
    cmd: >-
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    creates: "{{ homebrew_prefix }}/bin/brew"
  environment:
    NONINTERACTIVE: "1"
  tags: install

- name: Add Homebrew taps
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_taps }}"
  tags: install

# Homebrew 4.x requires explicit trust for third-party taps before installing their formulae/casks.
- name: Trust third-party taps
  ansible.builtin.command:
    cmd: "brew trust {{ brew_taps | join(' ') }}"
  register: homebrew_brew_trust_result
  changed_when: false
  failed_when: false
  tags: install

- name: Install common + dev + tap formulae
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_packages + brew_packages_dev + brew_packages_tap }}"
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  tags: install

- name: Install profile-specific formulae
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_packages_extra }}"
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  when:
    - brew_packages_extra is defined
    - brew_packages_extra | length > 0
  tags: install

- name: Install common casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_casks }}"
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  tags: install

- name: Install sudo-required casks (pkg-based, needs admin rights)
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_casks_sudo | default([]) }}"
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  ignore_errors: true
  tags: install
  register: brew_casks_sudo_result

- name: Warn about skipped sudo-required casks
  ansible.builtin.debug:
    msg: "Skipped (needs admin): {{ item.item }} — run the playbook manually with --ask-become-pass during a 10-minute admin window."
  loop: "{{ brew_casks_sudo_result.results }}"
  when: item.failed | default(false)
  tags: install

- name: Install profile-specific casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ brew_casks_extra }}"
  environment:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  when:
    - brew_casks_extra is defined
    - brew_casks_extra | length > 0
  tags: install

- name: Reminder — manual Homebrew-adjacent steps
  ansible.builtin.debug:
    msg:
      - "Nerd Font: install JetBrainsMono Nerd Font from https://www.nerdfonts.com (also shipped as cask font-jetbrains-mono-nerd-font)."
      - "Java JDK (optional, for nvim-jdtls): brew install temurin"
  tags: install
