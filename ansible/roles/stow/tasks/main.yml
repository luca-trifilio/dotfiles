---
# --- XDG packages (target = ~/.config, from .stowrc) ---
- name: Simulate stow of XDG packages
  ansible.builtin.command:
    cmd: stow --simulate --no-folding --verbose=2 .
    chdir: "{{ dotfiles_dir }}"
  register: stow_xdg_simulate
  changed_when: "'LINK:' in stow_xdg_simulate.stderr"
  check_mode: false
  tags: stow

- name: Apply stow of XDG packages
  ansible.builtin.command:
    cmd: stow --no-folding .
    chdir: "{{ dotfiles_dir }}"
  changed_when: "'LINK:' in stow_xdg_simulate.stderr"
  when: not ansible_check_mode
  tags: stow

# --- Home-target packages (target = $HOME) ---
- name: Simulate stow of home-target packages
  ansible.builtin.command:
    cmd: "stow --simulate --no-folding --verbose=2 --target={{ ansible_env.HOME }} {{ item }}"
    chdir: "{{ dotfiles_dir }}"
  loop:
    - zshrc
    - gitconfig
    - claude
  register: stow_home_simulate
  changed_when: "'LINK:' in stow_home_simulate.stderr"
  check_mode: false
  tags: stow

- name: Apply stow of home-target packages
  ansible.builtin.command:
    cmd: "stow --no-folding --target={{ ansible_env.HOME }} {{ item.item }}"
    chdir: "{{ dotfiles_dir }}"
  loop: "{{ stow_home_simulate.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: "'LINK:' in item.stderr"
  when: not ansible_check_mode
  tags: stow

# --- Claude Code secrets deny-rules (protect SOPS age key from Read/cat) ---
# ~/.claude/settings.json is real, unmanaged, personal config (not stow-
# symlinked), so merge just the deny rules idempotently instead of syncing
# the whole file.
- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0700"
  tags: stow

- name: Ensure ~/.claude/settings.json exists
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.claude/settings.json"
    content: "{}\n"
    force: false
    mode: "0600"
  tags: stow

- name: Merge Claude Code secrets deny-rules into ~/.claude/settings.json
  ansible.builtin.shell: |
    set -euo pipefail
    jq --argjson new '{{ claude_secrets_deny_rules | to_json }}' \
      '.permissions.deny = ((.permissions.deny // []) + $new | unique)' \
      "{{ ansible_env.HOME }}/.claude/settings.json" > "{{ ansible_env.HOME }}/.claude/settings.json.tmp"
    diff -q "{{ ansible_env.HOME }}/.claude/settings.json" "{{ ansible_env.HOME }}/.claude/settings.json.tmp" >/dev/null \
      && rm "{{ ansible_env.HOME }}/.claude/settings.json.tmp" \
      || { mv "{{ ansible_env.HOME }}/.claude/settings.json.tmp" "{{ ansible_env.HOME }}/.claude/settings.json"; echo CHANGED; }
  register: claude_deny_merge
  changed_when: "'CHANGED' in claude_deny_merge.stdout"
  when: not ansible_check_mode
  tags: stow

# --- Templated gitconfig-local (work: email; personal: Forgejo CF headers) ---
- name: Template ~/.gitconfig-local
  ansible.builtin.template:
    src: gitconfig-local.j2
    dest: "{{ ansible_env.HOME }}/.gitconfig-local"
    mode: "0600"
  tags: stow

# --- Templated ~/.kube/config (both: EKS test/staging; personal: homelab) ---
- name: Ensure ~/.kube directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0700"
  tags: stow

- name: Template ~/.kube/config
  ansible.builtin.template:
    src: kubeconfig.j2
    dest: "{{ ansible_env.HOME }}/.kube/config"
    mode: "0600"
  tags: stow

# --- git hooks path (auto-apply ansible after git pull via git-hooks/) ---
- name: Set core.hooksPath for dotfiles repo
  community.general.git_config:
    name: core.hooksPath
    value: git-hooks
    scope: local
    repo: "{{ dotfiles_dir }}"
  tags: stow

# --- pre-commit git hooks (yamllint + ansible syntax-check) ---
# Installs the hook into .git/hooks/. Idempotent via `creates`; needs the
# pre-commit binary (brew_packages_dev) so it's skipped in check mode.
- name: Install pre-commit git hooks
  ansible.builtin.command:
    cmd: pre-commit install --install-hooks
    chdir: "{{ dotfiles_dir }}"
    creates: "{{ dotfiles_dir }}/.git/hooks/pre-commit"
  when: not ansible_check_mode
  tags: stow
