---
machine_profile: work
expected_hostname: "0876-Pro-14"

# work_git_email comes from the SOPS vault (group_vars/work/vault.sops.yaml)
git_user_email: "{{ work_git_email }}"

enable_docs: false

# Work-only formulae
brew_packages_extra:
  - libpq
  - mysql-client
  - keidarcy/tap/e1s

# Work-only casks (none yet — add machine-specific casks here)
brew_casks_extra: []

# Hindsight project tags: directory -> project name (untagged elsewhere).
# Names are identical to personal; personal repos live under ~/Progetti/Personali.
hindsight_projects:
  - { path: "~/Progetti/Personali/homelab", name: "homelab" }
  - { path: "~/Progetti/dotfiles", name: "dotfiles" }
  - { path: "~/Progetti/Personali/storie", name: "storie" }
  - { path: "~/Progetti/Personali/storie-ios", name: "storie" }
  - { path: "~/Progetti/bck_transaction", name: "transaction" }
  - { path: "~/Progetti/bck_payment_hub", name: "payment-hub" }
  - { path: "~/Progetti/bck_payment_hub_gitops", name: "payment-hub" }
